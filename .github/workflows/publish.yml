name: Publish npm packages

on:
  workflow_dispatch: # Publishes all packages; identical, already published versions are skipped.

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run typecheck

      - name: Publish
        run: node scripts/helpers/publish.mjs
